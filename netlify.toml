[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Node 20 went end of life on 30 Apr 2026.
  NODE_VERSION = "22"

[[redirects]]
  from = "/full"
  to = "https://markheij.com/media-kit/full"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://markheij.com/:splat"
  status = 301
  force = true
